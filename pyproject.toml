[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsot-align-rna"
version = "0.1.0"
description = "D/S ordered-tree alignment for RNA secondary structure clustering and classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]

[project.scripts]
dsot-align = "treernaalign_ds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
